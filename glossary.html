<script>
var G = [
["ACE","ACE 탐사선","지구–태양을 잇는 선 위(L1 지점)에 있는 고급 조성 탐사선(Advanced Composition Explorer). 지구에 닥칠 태양풍 플라스마와 복사 상태를 미리 측정합니다."],
["active regions","활동 영역","태양 대기 중 교란된 부분. 아래에서 위로 흑점, 플라주, 홍염, 뜨거운 자기 고리로 이루어진 경우가 많습니다. 자기 폭발 때 많은 에너지를 내놓아 코로나 질량 방출(CME)이나 플레어를 일으킬 수 있습니다."],
["ambient solar wind","배경 태양풍","교란되지 않은 평상시 태양풍. 전리된 태양 대기가 행성간 공간으로 꾸준히 흘러나가는 것입니다."],
["AU (Astronomical Unit)","천문단위","지구와 태양 사이의 평균 거리(약 1억 5천만 km). 태양계 안의 거리를 나타낼 때 편리한 단위입니다."],
["aurora","오로라","고위도 하늘에 커튼이나 빛줄기처럼 일렁이며 나타나는 일시적인 빛. 지자기 교란과 관련됩니다."],
["auroral region","오로라 지대","지자기극을 중심으로 한 타원 모양의 고위도 띠. 오로라가 가장 잘 보이는 곳입니다."],
["auroral activity","오로라 활동","보통은 눈에 보이는 오로라와 그것을 만드는 입자를 말하지만, 오로라 지대에 흐르는 전류를 가리키기도 합니다. 오로라 활동을 재는 척도 중 하나가 반구 전력(hemispheric power)입니다."],
["auroral boundary","오로라 경계","오로라 지대의 고위도 쪽과 저위도 쪽 끝. 보통 극 쪽은 72°, 적도 쪽은 62° 정도입니다."],
["auroral precipitation","오로라 입자 강하","지구 대기로 떨어지거나 가속되어 들어오는 전리된 입자. 오로라를 만들고 전류가 흐르도록 돕습니다."],
["cadence","관측 주기(케이던스)","과학 장비(주로 영상 장치)가 자료를 기록하는 빈도."],
["Carrington event","캐링턴 사건","1859년 8월 말~9월 초에 일어난 매우 강한 태양 플레어와 그 뒤의 강력한 지자기 활동. 관측 사상 가장 큰 지자기 폭풍으로 꼽힙니다."],
["Carrington rotation","캐링턴 자전","태양이 한 바퀴 자전하는 것. 주기는 약 27일입니다."],
["chromosphere","채층","광구 바로 위에 있는 태양 대기층. 수소 알파선만 통과시키는 특수한 좁은 대역 망원경으로 볼 수 있습니다."],
["Corotating Interaction Region (CIR)","공회전 상호작용 영역","앞서가는 느린 태양풍을 뒤따라오는 빠른 태양풍이 압축해서, 태양풍 플라스마 밀도와 행성간 자기장이 강해진 영역. 지구 기준으로 이 영역이 지나가면서 수 시간~수십 시간 동안 작거나 중간 규모의 지자기 교란을 일으키는 경우가 많습니다."],
["CME (Coronal Mass Ejection)","코로나 질량 방출","태양 바깥 대기에서 일어나는 폭발로, 자기장을 품은 플라스마 구름 수십억 톤을 행성간 공간으로 내보냅니다. 빠르게 날아가면 태양풍 속에 충격파를 만듭니다. CME가 지구에 닿으면 뒤이어 지자기 폭풍이 오는 경우가 많습니다."],
["CME angular width","CME 각폭","CME 전체의 각도 폭. 태양에서 멀어지며 퍼지는 CME의 크기를 나타냅니다."],
["CME opening half-angle","CME 반개각","CME 각폭의 절반. CME는 행성간 공간에서 원뿔 모양으로 퍼진다고 가정하는 경우가 많은데, 이때 원뿔 가장자리와 중심축 사이의 각도입니다."],
["CME parameters","CME 매개변수","CME의 기본 특성. 하늘면 속도, 시선 방향 속도, 폭, 경도, 위도 등입니다."],
["CME plane of sky measurements","CME 하늘면 측정","태양–관측자를 잇는 선에 수직인 면(관측 영상 면)에서 측정한 CME의 이동·팽창이나 모습."],
["CME plane of sky speed","CME 하늘면 속도","태양–관측자 선에 수직인 방향의 CME 속도. 관측자 쪽(또는 반대쪽)으로 다가오는 움직임은 빠져 있으므로 실제 속도보다 언제나 작게 나옵니다."],
["CME radial velocity","CME 방사 속도","하늘면 속도로부터 여러 방법(발생 위치, 기하학적 삼각 측량, 모델 맞춤 등)으로 구한 CME의 3차원 속도."],
["cone model","원뿔 모델","CME가 좁은 꼭짓점에서 출발해 둥근 단면으로 퍼지며 원뿔 모양을 그린다고 가정하는 CME 전파 모델."],
["coronagraph","코로나그래프","시야 안에서 별(태양)의 빛을 가려, 그 주변의 대기, 특히 태양 코로나를 볼 수 있게 한 망원경이나 부착 장치."],
["coronagraph field of view","코로나그래프 시야","코로나그래프가 보는 하늘의 전체 범위. 태양의 겉보기 지름은 약 0.5°입니다. 시야가 3°인 코로나그래프는 태양 반지름의 2~6배 범위를 봅니다(반지름 2배 안쪽은 가려짐)."],
["coronagraph difference images","코로나그래프 차분 영상","현재 영상에서 앞선 영상을 빼서 두 영상 사이의 변화를 찾는 방법. 배경이 대부분 지워져 새로 생긴 변화가 도드라집니다. CME의 팽창과 이동을 추적할 때 자주 씁니다."],
["coronal hole","코로나 구멍","극자외선(EUV)이나 X선으로 보면 주변보다 어둡게 보이는, 태양 상층 대기의 넓은 영역. 자기력선이 열려 있어 빠른 태양풍이 나옵니다."],
["coronal loop","코로나 고리","코로나 아래쪽과 전이층의 기본 구조. 태양 내부에서 꼬인 자기 다발이 그대로 드러난 것으로, 그 수는 태양 주기와 직접 연결됩니다. 그래서 고리의 발치에 흑점이 있는 경우가 많습니다. 솟아오르는 자기 다발이 광구를 뚫고 나오면서 아래의 차가운 플라스마가 드러나고, 이 대비 때문에 흑점이 어둡게 보입니다."],
["differential rotation","차등 자전","태양이 위도마다 다른 속도로 자전하는 것. 적도 쪽이 빠르고 극 쪽이 느립니다."],
["diffuse aurora","확산 오로라","플라스마층의 입자가 손실 원뿔로 흩어져, 자기력선을 따라 추가로 가속되지 않고 오로라 지대로 떨어질 때 생기는 오로라. 대개 눈에 잘 보이지 않으며, 계속 일어나고, 지자기 활동이 강해지면 적도 쪽으로 넓어집니다."],
["discrete aurora","분리 오로라","두 가지 메커니즘으로 가속된 입자가 만드는 오로라. 준정적 전기장(에너지가 한 값에 몰린 입자를 만듦)과 분산성 알벤파(넓은 에너지 범위로 전자를 가속함)입니다. 우리가 흔히 보는 빛줄기와 커튼 모양 오로라가 이것입니다."],
["ecliptic plane","황도면","지구가 태양을 도는 궤도면. 태양을 도는 다른 천체나 태양·지구 기준으로 위치를 나타내야 하는 대상을 표시할 때 기준면으로 씁니다. 황도면과 어떤 궤도면 사이의 각도를 궤도 경사각이라고 합니다."],
["electromagnetic spectrum","전자기 스펙트럼","전자기파(복사)를 파장과 주파수 순서로 늘어놓은 것. 태양 복사의 정점은 스펙트럼 가운데쯤인 가시광선이지만, 태양은 파장이 짧은(에너지가 높은) 감마선부터 파장이 긴(에너지가 낮은) 전파까지 모두 내보냅니다."],
["electron volt (eV)","전자볼트","전하 하나를 가진 입자(전자, 양성자 등)가 1볼트의 전위차를 지날 때 얻는 작은 에너지 단위. 1.602×10⁻¹⁹ J입니다. 고에너지 입자는 메가전자볼트(MeV) 이상의 에너지를 가집니다."],
["energetic charged particles","고에너지 하전 입자","빛의 속도의 상당 부분(적어도 1%)으로 움직일 만큼 에너지가 큰 전자, 양성자, 때로는 더 무거운 이온. 우주선 부품이나 DNA 같은 생체 물질에 전리 방사선 손상을 줄 수 있습니다."],
["energetic electrons","고에너지 전자","우주 플라스마의 보통 전자보다 훨씬 빠르게 움직여, 우주선과 우주인에게 전리 방사선 손상을 줄 수 있는 전자."],
["energetic protons","고에너지 양성자","우주 플라스마의 보통 양성자보다 훨씬 빠르게 움직여, 우주선과 우주인에게 방사선 손상을 줄 수 있는 양성자."],
["geoeffective","지구 영향성","지자기 폭풍을 일으킬 수 있는 태양풍 조건을 가리키는 말."],
["geomagnetic storm","지자기 폭풍(우주기상 폭풍)","태양풍 조건이 바뀌어 지구 자기권의 자기장이 교란되는 것. 보통 3~6일 이어집니다."],
["geomagnetic Kp index","지자기 Kp 지수","조용한 날과 비교해 지구 중·고위도 자기장이 얼마나 교란되었는지 나타내는 지표."],
["geostationary (GEO) orbit","정지궤도","적도 바로 위, 경사각 0°의 원궤도. 공전 주기가 23시간 56분 4초여서 땅에서 보면 언제나 하늘의 같은 자리에 있는 것처럼 보입니다. 정지궤도는 지구동기궤도(주기가 지구 자전과 같은 궤도)의 한 종류이며, 둘 다 먼 별을 기준으로 한 지구 자전 속도와 같은 속도로 돕니다."],
["GOES","GOES 위성","정지궤도 환경 위성(Geostationary Operational Environmental Satellites). NASA가 만들어 발사하고 NOAA(미국 해양대기청)가 운영합니다. 미국 본토 위 정지궤도에서 주로 기상을 관측하며, 우주 환경을 감시하는 장비도 싣고 있습니다."],
["halo CME","헤일로 CME","코로나그래프의 가림판을 고리처럼 둘러싸며 퍼져 보이는 CME. 태양 앞면이나 뒷면에서 출발해 관측자 쪽 또는 그 반대쪽으로 날아가는 것입니다. 원문은 지구를 향한 헤일로 CME의 약 70%가 지자기 폭풍을 일으킨다고 적고 있습니다. 다만 이 비율은 연구에 따라 대략 절반에서 70% 정도로 차이가 납니다."],
["Heliocentric Earth Equatorial coordinates (HEEQ)","태양 중심 지구 적도 좌표계","Z축은 태양 자전축과 나란하게(북쪽이 +), X축은 지구에서 본 태양 적도와 태양 중앙 자오선이 만나는 쪽을 향하게 잡은 좌표계. 태양 중심 태양 좌표계(HS)라고도 합니다."],
["heliosphere","태양권","태양의 바깥으로 흘러나가는 대기가 지배하는 공간. 다른 별의 경우를 보면, 성간풍과 맞닿아 물방울 모양일 것으로 생각됩니다."],
["hemispheric power","반구 전력","오로라 활동의 척도. 자기권이나 태양풍의 하전 입자가 오로라 지대로 들어와 고층 대기 입자와 부딪치면 속도가 줄면서 운동 에너지를 대기에 넘겨줍니다. 이 에너지가 쌓이는 비율을 오로라 지대 전체에 걸쳐 더한 값입니다."],
["high speed solar wind stream","고속 태양풍","코로나 구멍에서 나오는 빠른 태양풍의 흐름. 빠른 흐름은 느린 흐름보다 파커 나선이 덜 감기기 때문에, 어느 거리에 이르면 앞서가는 느린 태양풍을 따라잡습니다."],
["ionization","전리(이온화)","자외선이나 X선 광자의 에너지를 원자의 전자가 흡수해 원자에서 완전히 떨어져 나가고, 양전하를 띤 이온이 남는 과정."],
["ionizing radiation","전리 방사선","DNA나 우주선 전자 장비 같은 분자 구조를 손상시킬 수 있는 고에너지 하전 입자(주로 전자·양성자)나 광자 복사(자외선·X선)."],
["ionosphere","전리층","고에너지 과정 때문에 일부 전자가 원래의 이온에서 떨어져 나와 있는 대기층. 충분한 에너지를 가진 태양 광자, 태양 양성자, 오로라 입자가 전자를 떼어 내 약한 플라스마를 만듭니다."],
["Kp index","Kp 지수","지자기 교란의 크기를 0~9로 나타낸 지수. 0은 매우 조용함, 9는 큰 지자기 폭풍입니다. 3시간마다 하나씩 나옵니다. Kp가 높을수록 지자기 폭풍이 일어나고, 오로라가 평소보다 낮은 위도에서 보이며, 고층 대기와 자기권의 결합이 강해집니다."],
["L1 point","L1 지점","지구와 태양 사이에 있는 (불안정한) 중력 균형점인 라그랑주 점 1. 지구에 가깝고 항상 지구–태양 선 위에 있습니다. 여러 태양 감시 위성이 L1 주위를 돌고 있습니다."],
["magnetic reconnection","자기 재결합","전기가 잘 통하는 플라스마 안에서 자기장의 연결 구조가 다시 짜이면서, 자기 에너지가 운동 에너지, 열 에너지, 입자 가속으로 바뀌는 물리 과정."],
["magnetopause","자기권계면","자기권의 경계. 바깥쪽은 태양풍 자기장과의 상호작용이 지배하고, 안쪽은 주로 지구 자기장의 영향을 받습니다."],
["magnetosphere","자기권","별이나 행성의 자기장이 지배하는 공간. 지구 자기권은 흘러가는 태양풍 때문에 물방울 모양이 됩니다."],
["MHD","자기유체역학","플라스마를 포함한 전도성 유체의 물리를 설명하는 이론. 유체 이론(‘유체역학’)과 전자기학(‘자기’)을 함께 다룹니다."],
["Parker spiral","파커 나선","태양 자전 때문에 태양풍의 자기장이 이루는 아르키메데스 나선 모양. 돌아가는 스프링클러에서 뿌려진 물줄기가 나선을 그리는 것과 같습니다. 1 AU에서 태양풍 자기력선은 약 45° 각도를 이룹니다."],
["particle flux","입자 플럭스","단위 면적을 단위 시간에 지나가는 입자의 수."],
["penumbra","반암부","흑점의 바깥쪽, 덜 어두운 부분. 줄무늬나 가는 실 같은 모습입니다."],
["photosphere","광구","태양 광자 대부분이 나오는 얇은 태양 대기층. 우리가 보는 ‘태양 표면’입니다."],
["plage","플라주","광구·채층·전이층에서 나오는 가시광선과 자외선의 밝은 방출. 자기장이 모인 곳과 관련 있으며, 채층의 밝은 그물 무늬의 일부를 이룹니다. 흑점 극대기에 늘어나는 태양 복사의 대부분이 이곳에서 나옵니다."],
["plasma","플라스마","원자가 이온과 전자로 나뉜 물질의 제4상태."],
["POES","POES 위성","극궤도 환경 위성(Polar Orbiting Environmental Satellites). 극지방 위의 지구 환경과 우주 환경을 거의 끊임없이 감시하는 위성군입니다."],
["reconnection","재결합","자기 재결합(magnetic reconnection)을 보세요."],
["SDO","태양 역학 관측선","태양 활동이 어떻게 생기고 그 활동에서 우주기상이 어떻게 나오는지 연구하도록 설계된 탐사선. 장비는 ① 대기 영상 장치(AIA) ② 극자외선 변동 실험(EVE) ③ 일진학·자기 영상기(HMI) 세 가지이며, 모두 동시에 태양을 봅니다. 2010년 2월 11일, 태양을 쉬지 않고 볼 수 있는 경사 지구동기궤도(경사각 28.5°)로 발사되었습니다."],
["solar","태양의","태양과 관련된 성질이나 현상을 나타내는 형용사."],
["solar atmosphere","태양 대기","광자가 우주로 자유롭게 빠져나갈 수 있는 태양의 층들. 광구, 채층, 전이층, 코로나로 이루어집니다."],
["solar corona","태양 코로나","눈에 보이는 태양 대기의 가장 바깥 부분."],
["solar cycle of magnetic activity","태양 자기 활동 주기","태양 자기장이 약 22년(지구 연 기준)마다 되풀이하는 변화. 흑점 수의 주기는 그 절반인 약 11년입니다."],
["solar wind","태양풍","태양에서 흘러나오는 플라스마."],
["space weather","우주기상","태양 활동과 태양풍 때문에 변하는 우주의 상태."],
["spectral notation","분광 표기법","분광학에서 이온화 정도를 로마 숫자로 나타내는 관례. 실제로 떨어져 나간 전자 수보다 하나 큰 숫자를 씁니다. 예를 들어 He II는 전자 하나를 잃은 헬륨입니다."],
["STEREO","STEREO 탐사선","태양–지구 관계 관측선(Solar TErrestrial RElations Observatory). 똑같은 탐사선 두 대로, STEREO A(Ahead)는 지구보다 태양에 가깝게, STEREO B(Behind)는 더 멀게 돕니다. 태양 영상 장비와 태양풍 검출기를 싣고 있으며, 지구에서 점점 멀어지는 궤도 덕분에 태양에서 떠나는 교란을 입체적으로 볼 수 있습니다."],
["streamer","스트리머","닫힌 자기장 영역 위에 놓인 코로나 구조. 뾰족한 투구 같은 모양이어서 투구 스트리머(helmet streamer)라고도 합니다."],
["sunspot","흑점","광구에 일시적으로 나타나 주변보다 어둡게 보이는 점. 강한 자기장이 대류를 막아 온도(약 3,000~4,500 K)가 주변(약 6,000 K)보다 낮아서 어둡게 보입니다. 지름은 16 km에서 160,000 km까지 다양합니다. 보통 짝을 지어 나타나며, 짝을 이룬 흑점은 서로 반대 자기극을 가집니다. 흑점에는 코로나 고리와 재결합 현상이 함께 있고, 대부분의 플레어와 CME가 흑점 무리 주변의 활동 영역에서 일어납니다."],
["tachocline","타코클라인","차등 자전하는 대류층과 균일하게 자전하는 내부 사이의 얇은 전단층. 아래는 복사층, 위는 대류층과 맞닿아 있습니다."],
["transition region","전이층","채층과 코로나 사이의 영역. 온도가 2만 K에서 100만~200만 K까지 치솟습니다. 이 아래에서는 중력이 구조의 모양을 지배해 층과 수평 구조(흑점 등)로 설명할 수 있지만, 위에서는 동역학적 힘이 지배하므로 전이층 자체도 특정 높이의 뚜렷한 층은 아닙니다."],
["X-ray flare","X선 플레어","전자기 스펙트럼의 0.1~0.8 nm 대역에서 관측되는, 태양 대기의 국소적인 밝아짐. GOES 위성이 측정한 이 대역 세기로 A·B·C·M·X 등급을 매깁니다."]
];

(function(){
  var box = document.getElementById('terms'), q = document.getElementById('q'),
      cnt = document.getElementById('cnt'), letters = document.getElementById('letters');
  G.sort(function(a,b){ return a[0].toLowerCase().localeCompare(b[0].toLowerCase()); });
  function esc(s){ return s.replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function hl(s, k){
    s = esc(s); if (!k) return s;
    var re = new RegExp('(' + k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    return s.replace(re, '<mark>$1</mark>');
  }
  function idOf(t){ return 't-' + t.toLowerCase().replace(/[^a-z0-9]+/g, '-'); }
  function render(){
    var k = q.value.trim(), kl = k.toLowerCase(), html = '', n = 0;
    G.forEach(function(g){
      if (kl && (g[0] + ' ' + g[1] + ' ' + g[2]).toLowerCase().indexOf(kl) < 0) return;
      n++;
      html += '<article class="term" id="' + idOf(g[0]) + '"><h2><span class="en">' + hl(g[0], k) +
              '</span><span class="ko">' + hl(g[1], k) + '</span></h2><p>' + hl(g[2], k) + '</p></article>';
    });
    box.innerHTML = html || '<p class="empty">찾는 용어가 없습니다. 다른 낱말로 검색해 보세요.</p>';
    cnt.textContent = k ? ('“' + k + '” 검색 결과 ' + n + '개') : ('전체 ' + G.length + '개 용어');
    letters.style.display = k ? 'none' : '';
  }
  var seen = {};
  G.forEach(function(g){
    var L = g[0][0].toUpperCase();
    if (seen[L]) return; seen[L] = 1;
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'btn'; b.textContent = L;
    b.setAttribute('aria-label', L + '로 시작하는 용어로 이동');
    b.addEventListener('click', function(){
      var el = document.getElementById(idOf(g[0]));
      if (el) el.scrollIntoView({behavior: 'smooth', block: 'start'});
    });
    letters.appendChild(b);
  });
  q.addEventListener('input', render);
  document.getElementById('clear').addEventListener('click', function(){ q.value = ''; render(); q.focus(); });
  var tt = document.getElementById('toTop');
  function top(e){ if (e) e.preventDefault(); window.scrollTo({top: 0, behavior: 'smooth'}); }
  tt.addEventListener('click', top); document.getElementById('top2').addEventListener('click', top);
  window.addEventListener('scroll', function(){ tt.classList.toggle('show', window.scrollY > 600); }, {passive: true});
  render();
})();
</script>
</body>
</html>
