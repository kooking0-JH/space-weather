<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker><radialGradient id="sun" cx=".45" cy=".45" r=".6"><stop offset="0" stop-color="#fff7c2"/><stop offset=".5" stop-color="#ffb020"/><stop offset="1" stop-color="#e24a12"/></radialGradient><radialGradient id="earth" cx=".4" cy=".4" r=".7"><stop offset="0" stop-color="#7cc7ff"/><stop offset=".7" stop-color="#1d6fd1"/><stop offset="1" stop-color="#0b3d7a"/></radialGradient></defs>
<rect width="900" height="300" fill="#fff"/>
<rect x="20" y="70" width="190" height="150" rx="10" fill="#ffd27a" stroke="#94a3b8" stroke-width="1.5"/>
<text x="115.0" y="115.0" font-size="17" text-anchor="middle" fill="#222" font-weight="800">태양</text>
<text x="115.0" y="150.0" font-size="13" text-anchor="middle" fill="#334155" font-weight="400">모든 교란의 출발점</text>
<line x1="212.0" y1="145.0" x2="240.0" y2="145.0" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
<rect x="242" y="70" width="190" height="150" rx="10" fill="#fde7c2" stroke="#94a3b8" stroke-width="1.5"/>
<text x="337.0" y="115.0" font-size="17" text-anchor="middle" fill="#222" font-weight="800">태양권 · 행성간 공간</text>
<text x="337.0" y="150.0" font-size="13" text-anchor="middle" fill="#334155" font-weight="400">태양풍이 채운 공간</text>
<text x="337.0" y="167.0" font-size="13" text-anchor="middle" fill="#334155" font-weight="400">지구–태양 1 AU</text>
<line x1="434.0" y1="145.0" x2="462.0" y2="145.0" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
<rect x="464" y="70" width="190" height="150" rx="10" fill="#e0d4ff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="559.0" y="115.0" font-size="17" text-anchor="middle" fill="#222" font-weight="800">지구 자기권</text>
<text x="559.0" y="150.0" font-size="13" text-anchor="middle" fill="#334155" font-weight="400">태양풍을 막는 방패</text>
<text x="559.0" y="167.0" font-size="13" text-anchor="middle" fill="#334155" font-weight="400">지구 반지름의 약 10배</text>
<line x1="656.0" y1="145.0" x2="684.0" y2="145.0" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
<rect x="686" y="70" width="190" height="150" rx="10" fill="#cfe8ff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="781.0" y="115.0" font-size="17" text-anchor="middle" fill="#222" font-weight="800">전리층 · 열권</text>
<text x="781.0" y="150.0" font-size="13" text-anchor="middle" fill="#334155" font-weight="400">고도 약 60~1000 km</text>
<text x="781.0" y="167.0" font-size="13" text-anchor="middle" fill="#334155" font-weight="400">단파가 굴절되는 곳</text>
<text x="450.0" y="40.0" font-size="18" text-anchor="middle" fill="#222" font-weight="800">우주기상이 전해지는 길</text>
<text x="450.0" y="265.0" font-size="13" text-anchor="middle" fill="#64748b" font-weight="400">태양에서 생긴 변화가 왼쪽에서 오른쪽으로 차례로 전해집니다</text>
